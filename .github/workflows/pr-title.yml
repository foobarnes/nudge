name: PR title

# The squash-merge commit is the PR title, and the Release workflow reads it: `feat:` bumps minor, `fix:` and the
# rest bump patch, `!` marks a breaking change. The label it sets sorts the PR in the generated release notes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const types = ['feat', 'fix', 'perf', 'refactor', 'docs', 'test', 'build', 'ci', 'chore', 'revert', 'style'];
            const m = title.match(/^([a-z]+)(\([^)]+\))?(!)?: \S/);
            if (!m || !types.includes(m[1])) {
              core.setFailed(`PR title must be a Conventional Commit, e.g. "feat: snooze presets" or ` +
                `"fix(pill): snap flicker". Types: ${types.join(', ')}. Got: "${title}"`);
              return;
            }
            const label = m[3] ? 'breaking' : ({ feat: 'feature', fix: 'fix', perf: 'fix' }[m[1]] ?? 'maintenance');
            const managed = ['breaking', 'feature', 'fix', 'maintenance'];
            const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
            const current = context.payload.pull_request.labels.map(l => l.name);
            for (const name of current.filter(n => managed.includes(n) && n !== label)) {
              await github.rest.issues.removeLabel({ ...issue, name });
            }
            if (!current.includes(label)) await github.rest.issues.addLabels({ ...issue, labels: [label] });
